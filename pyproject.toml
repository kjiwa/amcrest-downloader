[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amcrest-downloader"
version = "0.2.0"
description = "Download and merge video recordings from Amcrest IP cameras"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
amcrest-downloader = "main:main"

[tool.setuptools]
py-modules = ["amcrest_api", "cli", "downloader", "logger", "main", "merger", "models"]
