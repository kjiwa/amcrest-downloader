name: Feature request
description: Propose a change to amcrest-downloader's behavior or CLI.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do that amcrest-downloader doesn't support today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd like to see, and why.
    validations:
      required: true
